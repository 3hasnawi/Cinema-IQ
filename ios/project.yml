name: CinemaIQ
options:
  bundleIdPrefix: com.cinemaplus.rebuilt
  deploymentTarget:
    iOS: "18.0"
packages:
  CinemaCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  CinemaIQ:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CinemaIQ
    dependencies:
      - package: CinemaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemaplus.rebuilt.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cinema iQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cinema iQ
        CFBundleDevelopmentRegion: ar
        # OMDb key for film information, posters and ratings (free tier: about 1000 requests a day).
        OMDbAPIKey: "5b9c7295"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The content sources are Iraqi ISP services whose servers do not all meet App Transport Security's
        # strict TLS defaults (Android's OkHttp accepts them). Relax ATS for these domains only; every other
        # host keeps the full defaults. Media from the sources' CDNs is allowed the same way.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSExceptionDomains:
            shabakaty.cc:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            shabakaty.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            vodu.me:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
  # Apple TV app: its own screens (CinemaIQTV) over the same Core and the same library, sync, providers and
  # playback model as the iPhone app.
  CinemaIQTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: CinemaIQTV
      - path: CinemaIQ/LibraryStore.swift
      - path: CinemaIQ/CloudSync.swift
      - path: CinemaIQ/PlaybackController.swift
      - path: CinemaIQ/ProviderStore.swift
      - path: CinemaIQ/Resources/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: CinemaCore
    scheme:
      testTargets:
        - CinemaIQTVUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemaplus.rebuilt.tv
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cinema iQ
        ASSETCATALOG_COMPILER_APPICON_NAME: Brand
        # No global accent: system buttons keep the Apple TV app's white and grey; orange is used for progress only.
    info:
      path: Generated/TV-Info.plist
      properties:
        CFBundleDisplayName: Cinema iQ
        CFBundleDevelopmentRegion: ar
        OMDbAPIKey: "5b9c7295"
        # From the TMDB_API_KEY secret at build time (never stored in the repository); empty builds skip TMDB.
        TMDBAPIKey: "$(TMDB_API_KEY)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSExceptionDomains:
            shabakaty.cc:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            shabakaty.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            vodu.me:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
  # Screenshot tour of the Apple TV app in the simulator (the "Apple TV screenshots" workflow).
  CinemaIQTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: CinemaIQTVUITests
    dependencies:
      - target: CinemaIQTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemaplus.rebuilt.tv.uitests
        TEST_TARGET_NAME: CinemaIQTV
