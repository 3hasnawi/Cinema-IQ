name: CinemaIQ
options:
  bundleIdPrefix: com.cinemaplus.rebuilt
  deploymentTarget:
    iOS: "18.0"
packages:
  CinemaCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  CinemaIQ:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CinemaIQ
    dependencies:
      - package: CinemaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemaplus.rebuilt.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cinema iQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cinema iQ
        CFBundleDevelopmentRegion: ar
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The content sources are Iraqi ISP services whose servers do not all meet App Transport Security's
        # strict TLS defaults (Android's OkHttp accepts them). Relax ATS for these domains only; every other
        # host keeps the full defaults. Media from the sources' CDNs is allowed the same way.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSExceptionDomains:
            shabakaty.cc:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            shabakaty.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
            vodu.me:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
              NSExceptionRequiresForwardSecrecy: false
