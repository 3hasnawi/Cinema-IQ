name: CinemaIQ
options:
  bundleIdPrefix: com.cinemaplus.rebuilt
  deploymentTarget:
    iOS: "17.0"
packages:
  CinemaCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CinemaIQ:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CinemaIQ
        excludes:
          - Resources/CAIRO-OFL.txt
    dependencies:
      - package: CinemaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemaplus.rebuilt.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cinema iQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIAppFonts: cairo_regular.ttf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cinema iQ
        UIAppFonts:
          - cairo_regular.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
