name: Apple TV player menu checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/CinemaIQTV/TVPlayerView.swift'
      - 'ios/CinemaIQTV/TVPauseInformation.swift'
      - 'ios/CinemaIQTV/TVCompatibilityTransport.swift'
      - 'ios/CinemaIQ/PlaybackController.swift'
      - 'ios/SharedIPTV/PlaybackAudioSession.swift'
      - 'ios/SharedIPTV/CompatibilityPlayback.swift'
      - 'ios/Core/Sources/CinemaCore/PlaybackSessionCoordinator.swift'
      - 'ios/CinemaIQTVUITests/TVPlayerMenuTests.swift'
      - 'ios/CinemaIQTVUITests/TVMovieCompatibilityTests.swift'
      - 'ios/CinemaIQTVUITests/TVMovieExitTests.swift'
      - '.github/workflows/tvos-player-menus.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: Full movie regression or focused startup/rapid Back checks
        type: choice
        options: [all, rapid-exit, queued-quality, startup-intent]
        default: all
permissions:
  contents: read
concurrency:
  group: tvos-player-menus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          cp ios/CinemaIQUITests/Fixtures/movie-audio-pattern.mp4 ios/CinemaIQTV/UIPlayerFixture.mp4
          cp ios/CinemaIQUITests/Fixtures/compatibility-pattern.mkv ios/CinemaIQTV/UICompatibilityFixture.mkv
          cd ios
          xcodegen generate --spec project.yml
      - name: Create Apple TV simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          def sim(*args):
              return subprocess.check_output(['xcrun','simctl',*args], text=True)
          runtimes = [r for r in json.loads(sim('list','runtimes','--json'))['runtimes']
                      if r['isAvailable'] and '.tvOS-' in r['identifier']]
          runtime = max(runtimes, key=lambda r: tuple(map(int,r['version'].split('.'))))['identifier']
          types = json.loads(sim('list','devicetypes','--json'))['devicetypes']
          device_type = next(t['identifier'] for t in types if 'Apple TV 4K' in t['name'] and '1080p' in t['name'])
          device = sim('create','CinemaPlayerMenus',device_type,runtime).strip()
          print('Player menu runtime:', runtime)
          with open(os.environ['GITHUB_ENV'],'a') as file:
              file.write('TV_MENU_DEVICE='+device+'\n')
          PY
      - name: Compile real app and UI tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/CinemaIQ.xcodeproj -scheme CinemaIQTV \
            -destination "id=$TV_MENU_DEVICE" -derivedDataPath "$RUNNER_TEMP/TVMenus" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY= OMDB_API_KEY= YOUTUBE_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'TEST BUILD SUCCEEDED' "$RUNNER_TEMP/build.log"
      - name: Install reference clip and boot simulator
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python3 ios/scripts/boot-simulator.py "$TV_MENU_DEVICE" "$RUNNER_TEMP/tvos-display-ready.png"
      - name: Test native menus and remote focus
        timeout-minutes: 20
        run: |
          set -o pipefail
          tests=(-only-testing:CinemaIQTVUITests/TVPlayerMenuTests
                 -only-testing:CinemaIQTVUITests/TVMovieCompatibilityTests
                 -only-testing:CinemaIQTVUITests/TVMovieExitTests)
          if [ "${{ inputs.scenario || 'all' }}" = rapid-exit ]; then
            tests=(-only-testing:CinemaIQTVUITests/TVMovieExitTests/testBackWhileMovieIsOpeningDoesNotReappearOrTrapRemote)
          fi
          if [ "${{ inputs.scenario || 'all' }}" = queued-quality ]; then
            tests=(-only-testing:CinemaIQTVUITests/TVPlayerMenuTests/testQualityChosenBeforeAudioActivationReachesNativeItem)
          fi
          if [ "${{ inputs.scenario || 'all' }}" = startup-intent ]; then
            tests=(-only-testing:CinemaIQTVUITests/TVPlayerMenuTests/testQualityChosenBeforeAudioActivationReachesNativeItem
                   -only-testing:CinemaIQTVUITests/TVMovieExitTests/testPausedOpeningKeepsBackgroundIntentAndQueuedSeekUntilRemoteResume
                   -only-testing:CinemaIQTVUITests/TVMovieExitTests/testNativeMovieBackAfterTwoMinutesAndImmediateResume)
          fi
          xcodebuild test-without-building -project ios/CinemaIQ.xcodeproj -scheme CinemaIQTV \
            -destination "id=$TV_MENU_DEVICE" -derivedDataPath "$RUNNER_TEMP/TVMenus" \
            "${tests[@]}" \
            -resultBundlePath "$RUNNER_TEMP/player-menus.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY= OMDB_API_KEY= YOUTUBE_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/player-menus.log" | grep -E 'error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)' || true
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' "$RUNNER_TEMP/player-menus.log"
      - name: Export screenshots and hierarchy
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/player-menus.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/player-menus.xcresult" --output-path "$RUNNER_TEMP/evidence"
            find "$RUNNER_TEMP/evidence" -name '*.mp4' -delete
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-player-menus-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/tvos-display-ready.png
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/player-menus.log
          retention-days: 1
          if-no-files-found: warn
