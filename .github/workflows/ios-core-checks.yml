name: iOS Core Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-core-checks.yml'
permissions:
  contents: read
concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test source parsing and media identity
        shell: bash
        run: |
          set +e
          swift test --package-path ios/Core 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Compiler and test failures as annotations, readable without the full log.
            grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/swift-test.log" | grep -v "Test Suite" | sed 's#.*/ios/Core/##' | cut -c1-300 | head -30 | while read -r line; do echo "::error::$line"; done
          fi
          exit $status
