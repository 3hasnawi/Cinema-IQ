name: Apple TV IPTV checks
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Run all IPTV checks or a focused scenario
        type: choice
        options: [all, quality, visibility, compatibility, guide, keyboard, hud, search, interaction]
        default: all
permissions:
  contents: read
concurrency:
  group: tvos-iptv-${{ github.ref }}-${{ inputs.scenario || 'all' }}
  cancel-in-progress: true
jobs:
  simulator:
    # Match the existing navigation check's Intel pool; ARM hosts can boot tvOS without a display/focus surface.
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate the test project
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          # Include the licensed local clip before Xcode seals and signs the simulator app.
          cp ios/CinemaIQUITests/Fixtures/player-pattern.mp4 ios/CinemaIQTV/UIPlayerFixture.mp4
          cp ios/CinemaIQUITests/Fixtures/compatibility-pattern.mkv ios/CinemaIQTV/UICompatibilityFixture.mkv
          cd ios
          xcodegen generate --spec project.yml
      - name: Create a TV simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q tvOS; then xcodebuild -downloadPlatform tvOS; fi
          python3 - <<'PY'
          import json, os, subprocess
          def sim(*args):
              return subprocess.check_output(['xcrun','simctl',*args],text=True)
          runtimes = [r for r in json.loads(sim('list','runtimes','--json'))['runtimes']
                      if r['isAvailable'] and '.tvOS-' in r['identifier']]
          runtime = max(runtimes,key=lambda r:tuple(map(int,r['version'].split('.'))))['identifier']
          types = json.loads(sim('list','devicetypes','--json'))['devicetypes']
          kind = next(t['identifier'] for t in types if 'Apple TV 4K' in t['name'] and 'at 1080p' in t['name'])
          device = sim('create','CinemaTVIPTVCheck',kind,runtime).strip()
          with open(os.environ['GITHUB_ENV'],'a') as file:
              file.write('TV_TEST_DEVICE='+device+'\n')
          PY
      - name: Compile app and remote tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/CinemaIQ.xcodeproj -scheme CinemaIQTV \
            -destination "id=$TV_TEST_DEVICE" -derivedDataPath "$RUNNER_TEMP/TVIPTVDerived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- TMDB_API_KEY= OMDB_API_KEY= YOUTUBE_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/tvos-iptv-build.log" | grep -E 'error:|TEST BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'TEST BUILD SUCCEEDED' "$RUNNER_TEMP/tvos-iptv-build.log"
      - name: Boot TV simulator with a display
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python3 ios/scripts/boot-simulator.py "$TV_TEST_DEVICE" "$RUNNER_TEMP/tvos-display-ready.png"
      - name: Test M3U entry, Xtream, Keychain persistence and remote playback
        timeout-minutes: 35
        env:
          IPTV_TEST_SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          set -o pipefail
          test_id=CinemaIQTVUITests/TVIPTVFlowTests
          if [ "$IPTV_TEST_SCENARIO" = quality ]; then test_id="$test_id/testHighestQualityPreferenceAndAutomaticSelection"; fi
          if [ "$IPTV_TEST_SCENARIO" = guide ]; then test_id="$test_id/testRemoteChannelSurfingAndFloatingGuide"; fi
          if [ "$IPTV_TEST_SCENARIO" = visibility ]; then test_id="$test_id/testFocusedVideoHasNoButtonBackdrop"; fi
          if [ "$IPTV_TEST_SCENARIO" = compatibility ]; then test_id="$test_id/testCompatibilityDecoderWithRemoteAndTracks"; fi
          if [ "$IPTV_TEST_SCENARIO" = keyboard ]; then test_id="$test_id/testAddM3USourceWithNativeKeyboard"; fi
          if [ "$IPTV_TEST_SCENARIO" = hud ]; then test_id="$test_id/testToolbarHidesWhileFocusedAndPopupsRestoreTheirIcons"; fi
          if [ "$IPTV_TEST_SCENARIO" = search ]; then test_id="$test_id/testGuideSearchDismissesNativeKeyboardAndRestoresNavigation"; fi
          if [ "$IPTV_TEST_SCENARIO" = interaction ]; then test_id="$test_id/testToolbarHidesWhileFocusedAndPopupsRestoreTheirIcons"; fi
          extra_tests=()
          if [ "$IPTV_TEST_SCENARIO" = compatibility ]; then extra_tests+=('-only-testing:CinemaIQTVUITests/TVIPTVFlowTests/testCompatibilityMovieTransportAndReturnToDetails'); fi
          if [ "$IPTV_TEST_SCENARIO" = keyboard ]; then extra_tests+=('-only-testing:CinemaIQTVUITests/TVIPTVFlowTests/testXtreamFormShowsCredentialsAndMenuReturnsSafely'); fi
          if [ "$IPTV_TEST_SCENARIO" = keyboard ]; then extra_tests+=('-only-testing:CinemaIQTVUITests/TVIPTVFlowTests/testSourcesGroupsPlaybackAndSelectionPersistence'); fi
          if [ "$IPTV_TEST_SCENARIO" = interaction ]; then
            for test in testGuideSearchDismissesNativeKeyboardAndRestoresNavigation testRemoteChannelSurfingAndFloatingGuide; do
              extra_tests+=("-only-testing:CinemaIQTVUITests/TVIPTVFlowTests/$test")
            done
          fi
          xcodebuild test-without-building -project ios/CinemaIQ.xcodeproj -scheme CinemaIQTV \
            -destination "id=$TV_TEST_DEVICE" -derivedDataPath "$RUNNER_TEMP/TVIPTVDerived" \
            -only-testing:"$test_id" "${extra_tests[@]}" \
            -resultBundlePath "$RUNNER_TEMP/tvos-iptv.xcresult" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- TMDB_API_KEY= OMDB_API_KEY= YOUTUBE_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/tvos-iptv.log" | grep -E 'error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)' || true
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' "$RUNNER_TEMP/tvos-iptv.log"
      - name: Export screenshots and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          try:
              container = subprocess.check_output(['xcrun','simctl','get_app_container',os.environ['TV_TEST_DEVICE'],
                                                   'com.cinemaplus.rebuilt.tv','data'], text=True, timeout=10, stderr=subprocess.DEVNULL).strip()
              diagnostic = pathlib.Path(container)/'Documents/compatibility-debug.txt'
              if diagnostic.exists():
                  shutil.copyfile(diagnostic, pathlib.Path(os.environ['RUNNER_TEMP'])/'compatibility-debug.txt')
          except (subprocess.SubprocessError, OSError):
              print('Decoder diagnostics unavailable; continuing to export actual test results')
          PY
          if [ -d "$RUNNER_TEMP/tvos-iptv.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tvos-iptv.xcresult" --output-path "$RUNNER_TEMP/tvos-iptv-evidence"
            find "$RUNNER_TEMP/tvos-iptv-evidence" -name '*.mp4' -delete
          fi
          grep -E 'error:|failed|Timed out|Test Case' "$RUNNER_TEMP/tvos-iptv.log" | tail -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-iptv-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compatibility-debug.txt
            ${{ runner.temp }}/tvos-iptv-build.log
            ${{ runner.temp }}/tvos-iptv.log
            ${{ runner.temp }}/tvos-iptv-evidence
          retention-days: 1
          if-no-files-found: warn
