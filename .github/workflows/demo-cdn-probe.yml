name: Demo CDN probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-demo-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Check licensed demo streams and artwork against the live CDN
        env:
          CINEMA_LIVE_NETWORK_TESTS: "1"
        run: swift test --package-path ios/Core --filter ExternalSourceTests.testDemoStreamsAndArtworkAreReachable
