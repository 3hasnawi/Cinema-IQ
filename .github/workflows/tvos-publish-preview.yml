name: Publish authorized Apple TV 0.3.1 preview

# The publication branch is created only after exact-commit tests and screenshot review.
# Branch pushes build/test but do not publish, preserving a separate visual review gate.
on:
  push:
    branches: ['chatgpt/tvos-publish-0.3.1']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: tvos-v0.3.1-preview.1
    steps:
      - name: Require successful checks for the exact tagged commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/chatgpt/tvos-publish-0.3.1"
          branch_sha="$(gh api "repos/$GH_REPO/git/ref/heads/chatgpt/tvos-preview-0.3.1" --jq '.object.sha')"
          test "$branch_sha" = "$GITHUB_SHA"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > runs.json
          python3 - <<'PY'
          import json, os
          runs = json.load(open('runs.json'))['workflow_runs']
          for name in ['iOS App Compile Check', 'Apple TV screenshots']:
              matches = [r for r in runs if r['name'] == name and r['head_sha'] == os.environ['GITHUB_SHA']]
              latest = max(matches, key=lambda r: r['id']) if matches else None
              if not latest or latest['conclusion'] != 'success':
                  raise SystemExit(f'Refusing release: {name} has not passed for this commit')
              if name == 'iOS App Compile Check':
                  with open(os.environ['GITHUB_ENV'], 'a') as out:
                      out.write(f"BUILD_RUN_ID={latest['id']}\n")
          PY
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing preview release.' >&2
            exit 1
          fi
      - name: Download the exact tested unsigned device app
        run: |
          gh run download "$BUILD_RUN_ID" --name "Cinema-iQ-AppleTV-branch-preview-$GITHUB_SHA" --dir preview
      - name: Verify platform, version, digest and approved credential scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, zipfile
          ipa = pathlib.Path('preview/Cinema-iQ-AppleTV-unsigned.ipa')
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'Corrupt archive'
              info = plistlib.loads(archive.read('Payload/CinemaIQTV.app/Info.plist'))
              assert not any(n.endswith(('.p12', '.p8', '.mobileprovision')) for n in archive.namelist()), 'Unexpected signing material'
          assert info['CFBundleIdentifier'] == 'com.cinemaplus.rebuilt.tv', 'Unexpected bundle identifier'
          assert info['CFBundleShortVersionString'] == '0.3.1', 'Unexpected app version'
          assert info['CFBundleVersion'] == '4', 'Unexpected build number'
          assert info.get('CFBundleSupportedPlatforms') == ['AppleTVOS'], 'Not a physical Apple TV app'
          assert info.get('TMDBAPIKey'), 'Approved TMDB metadata credential is missing'
          assert not info.get('OMDbAPIKey') and not info.get('YouTubeAPIKey'), 'Unapproved metadata credential'
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert pathlib.Path('preview/SHA256.txt').read_text().split()[0] == digest, 'Build artifact digest mismatch'
          pathlib.Path('preview/SHA256.txt').write_text(digest + '  ' + ipa.name + '\n')
          pathlib.Path('preview/SOURCE.txt').write_text('Source commit: ' + os.environ['GITHUB_SHA'] + '\n')
          PY
      - name: Publish the requested separate prerelease without replacing older releases
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF_NOTES
          Apple TV preview 0.3.1 (4), source $GITHUB_SHA, branch chatgpt/tvos-preview-0.3.1.

          Includes remote-driven Home hero selection, source-provided inline video trailer previews with mute/pause/replay, remembered playback quality with safe fallback, circular cast focus, TMDB cast portraits for matched movies/series, and a keyless TVmaze series fallback where available.

          Trailer previews require a direct MP4/MOV/M4V/HLS source URL. YouTube pages and arbitrary embedded players are not supported. Titles without matching metadata or available portraits may keep initials. TVmaze source and CC BY-SA 4.0 attribution are available beside applicable cast rows.

          This unsigned arm64 IPA is for physical Apple TV (tvOS 18+). Sign or re-sign it in atvloadly with your configured Apple identity. It is not an iPhone/Android build, App Store release or TestFlight upload. The repository owner explicitly authorized embedding the TMDB API key in this public IPA to enable cast portraits after being informed that recipients can extract and reuse it. No signing identity, OMDb key or YouTube key is included.

          Swift Core tests, iPhone/tvOS Release compilation, and Apple TV simulator navigation/settings/hero/cast tests passed for this exact commit. Simulator screenshots were reviewed before publication. ISP-restricted catalogs, real-account sync, physical-device playback, VoiceOver and Reduce Motion still need device acceptance.
          EOF_NOTES
          gh release create "$PREVIEW_TAG" \
            preview/Cinema-iQ-AppleTV-unsigned.ipa preview/SHA256.txt preview/SOURCE.txt \
            --target "$GITHUB_SHA" --title 'Cinema iQ Apple TV 0.3.1 Preview' \
            --notes-file release-notes.md --prerelease --latest=false
