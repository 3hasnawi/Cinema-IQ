name: Android TV screenshots

# Manual approval only: build the current branch for emulator validation, never publish a release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build approved debug and test APKs and run unit tests
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual TV UI with remote events and real Media3 playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/tv-validation.sh "$RUNNER_TEMP/tv-validation"
      - name: Save actual captures, assertions and approved debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-validation
          retention-days: 1
          path: |
            ${{ runner.temp }}/tv-validation/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
      - name: Keep build files in a draft for authenticated download
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tv-validation"
          cd "$RUNNER_TEMP/tv-validation"
          if compgen -G '*.png' > /dev/null; then
            zip -q validation-captures.zip ./*.png ./*.json ./*.txt
          fi
          files=()
          test ! -f validation-captures.zip || files+=(validation-captures.zip)
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test ! -f "$apk" || files+=("$apk")
          if (( ${#files[@]} )); then
            gh release create "tv-validation-${{ github.run_id }}" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Android TV emulator validation ${{ github.run_id }}" --notes 'Internal debug build and genuine emulator captures. Not a public app update. Read results.json for test status.'
          fi
