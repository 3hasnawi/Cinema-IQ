name: Android TV screenshots

# Manual approval only: build the current branch for emulator validation, never publish a release.
on:
  workflow_dispatch:
    inputs:
      reuse_release_run_id:
        description: Existing approved signed release run for IPTV keyboard diagnosis (builds no APK)
        type: string
        required: false
        default: ''
      source_input:
        description: Build an approved test APK and exercise source-field/keyboard traversal
        type: boolean
        required: false
        default: false
      reuse_input_run_id:
        description: Reuse a previously built approved input-test APK (builds no APK)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: tv-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REUSE_RELEASE_RUN_ID: ${{ inputs.reuse_release_run_id }}
      SOURCE_INPUT: ${{ inputs.source_input }}
      REUSE_INPUT_RUN_ID: ${{ inputs.reuse_input_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.reuse_release_run_id == '' && inputs.reuse_input_run_id == ''
      - name: Install Android SDK
        if: inputs.reuse_release_run_id == '' && inputs.reuse_input_run_id == ''
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build approved emulator APKs
        if: inputs.reuse_release_run_id == '' && inputs.reuse_input_run_id == ''
        run: |
          if [[ "$SOURCE_INPUT" == true ]]; then
            ./gradlew --no-daemon --console=plain :app:assembleDebug
          else
            ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
          fi
      - name: Reuse an existing approved signed APK without a build
        if: inputs.reuse_release_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run = os.environ['REUSE_RELEASE_RUN_ID']
          assert re.fullmatch(r'[0-9]+', run)
          metadata = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}']))
          assert metadata['conclusion'] == 'success' and metadata['head_branch'] == 'main'
          assert metadata['path'] == '.github/workflows/release.yml'
          subprocess.run(['gh','run','download',run,'--repo',os.environ['GITHUB_REPOSITORY'], '--name','cinema-iq-approved-release','--dir','approved-release'],check=True)
          PY
      - name: Reuse the approved input-test APK without rebuilding
        if: inputs.reuse_input_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          run = os.environ['REUSE_INPUT_RUN_ID']
          assert re.fullmatch(r'[0-9]+',run) and not os.environ['REUSE_RELEASE_RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          metadata = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          assert metadata['path'] == '.github/workflows/tv-screenshots.yml'
          jobs = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/jobs']))
          assert any(s['name']=='Build approved emulator APKs' and s['conclusion']=='success' for j in jobs['jobs'] for s in j['steps'])
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name','android-tv-validation','--dir','approved-input'],check=True)
          apks = list(Path('approved-input').rglob('app-debug.apk'))
          assert len(apks) == 1
          target = Path('approved-input/app-debug.apk')
          if apks[0] != target: shutil.copyfile(apks[0],target)
          out = Path(os.environ['RUNNER_TEMP'])/'tv-validation';out.mkdir(parents=True,exist_ok=True)
          (out/'source-apk.json').write_text(json.dumps({'run':run,'sourceCommit':metadata['head_sha'],'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'builtAgain':False},indent=2))
          PY
      - name: Install local IPTV media fixture generator
        if: inputs.reuse_release_run_id != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual TV UI with remote events and real Media3 playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/tv-validation-entry.sh "$RUNNER_TEMP/tv-validation"
      - name: Save actual captures, assertions and approved debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-validation
          retention-days: 1
          path: |
            ${{ runner.temp }}/tv-validation/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
      - name: Keep build files in a draft for authenticated download
        if: always() && inputs.reuse_release_run_id == '' && inputs.reuse_input_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tv-validation"
          cd "$RUNNER_TEMP/tv-validation"
          if compgen -G '*.png' > /dev/null; then
            zip -q validation-captures.zip ./*.png ./*.json ./*.txt
          fi
          files=()
          test ! -f validation-captures.zip || files+=(validation-captures.zip)
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test ! -f "$apk" || files+=("$apk")
          if (( ${#files[@]} )); then
            gh release create "tv-validation-${{ github.run_id }}" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Android TV emulator validation ${{ github.run_id }}" --notes 'Internal debug build and genuine emulator captures. Not a public app update. Read results.json for test status.'
          fi
