name: Android TV screenshots

# Builds a debug APK (never published), runs it in an Android TV emulator, walks it with remote keys and publishes
# the screenshots to the tv-screenshots branch. Manual, or on pushes that change the tour on a TV work branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/tv-**']
    paths:
      - 'app/**'
      - '.github/scripts/tv-tour.sh'
      - '.github/workflows/tv-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: tv-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK for the emulator
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Probe Dawwirli catalog answers
        run: |
          mkdir -p "$RUNNER_TEMP/tv-shots"
          for q in "cat?id=newest&kind=series&page=1" "cat?id=newest&kind=movies&page=1" "section?id=series" "ar/home"; do
            name=$(echo "$q" | tr '?&=/' '____')
            curl -s -m 20 "https://premium.dawwirli.watch/api/$q" | head -c 6000 > "$RUNNER_TEMP/tv-shots/probe-$name.json" || true
          done
          ls -la "$RUNNER_TEMP/tv-shots"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the app in an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/tv-tour.sh "$RUNNER_TEMP/tv-shots"
      - name: Publish screenshots to the tv-screenshots branch
        if: always()
        run: |
          set -euo pipefail
          trap 'echo "::error::publish failed (exit $?) at: $BASH_COMMAND"' ERR
          cd "$RUNNER_TEMP/tv-shots"
          ls
          git init -q -b tv-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Android TV screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tv-screenshots 2>&1 | tail -3 | sed 's/^/::warning::push: /'
