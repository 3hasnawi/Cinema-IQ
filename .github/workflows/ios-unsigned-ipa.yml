name: Build unsigned iPhone and iPad IPA

# Manual only: exporting an app requires an explicit user build request.
on:
  workflow_dispatch:
    inputs:
      include_apple_tv:
        description: Also export the unchanged Apple TV app
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iphone-ipa:
    runs-on: macos-15-intel
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/CinemaIQDerivedData" >> "$GITHUB_ENV"
          echo "IPA_STAGING=$RUNNER_TEMP/CinemaIQIPA" >> "$GITHUB_ENV"
      - name: Select the newest installed Xcode
        # Liquid Glass needs the iOS 26 SDK or later; the app still builds (without glass) on older Xcode.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
      - name: Inspect Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test source parsing
        run: swift test --package-path ios/Core
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile Release for physical iPhone and iPad without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
      - name: Package unsigned device app
        run: |
          set -euo pipefail
          device_app="$DERIVED_DATA/Build/Products/Release-iphoneos/CinemaIQ.app"
          test -d "$device_app"
          test -x "$device_app/CinemaIQ"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$device_app/Info.plist"
          python3 - "$device_app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              info = plistlib.load(source)
          assert info['CFBundleIdentifier'] == 'com.cinemaplus.rebuilt.ios'
          assert info['UIDeviceFamily'] == [1, 2], 'Universal iPhone/iPad device families required'
          assert len(info['UISupportedInterfaceOrientations~ipad']) == 4
          assert not info.get('UIRequiresFullScreen', False)
          print('Validated universal iOS app:', info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PY
          xcrun lipo "$device_app/CinemaIQ" -verify_arch arm64
          mkdir -p "$IPA_STAGING/Payload" "$RUNNER_TEMP/ipa-output"
          ditto "$device_app" "$IPA_STAGING/Payload/CinemaIQ.app"
          ditto -c -k --keepParent "$IPA_STAGING/Payload" "$RUNNER_TEMP/ipa-output/Cinema-iQ-iPhone-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/ipa-output/Cinema-iQ-iPhone-unsigned.ipa"
      - name: Compile Release for Apple TV without signing
        if: inputs.include_apple_tv
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" OMDB_API_KEY="$OMDB_API_KEY" YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
      - name: Package unsigned Apple TV app
        if: inputs.include_apple_tv
        run: |
          set -euo pipefail
          tv_app="$DERIVED_DATA/Build/Products/Release-appletvos/CinemaIQTV.app"
          test -d "$tv_app"
          test -x "$tv_app/CinemaIQTV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$tv_app/Info.plist"
          xcrun lipo "$tv_app/CinemaIQTV" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/TVIPA/Payload" "$RUNNER_TEMP/tv-output"
          ditto "$tv_app" "$RUNNER_TEMP/TVIPA/Payload/CinemaIQTV.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/TVIPA/Payload" "$RUNNER_TEMP/tv-output/Cinema-iQ-AppleTV-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/tv-output/Cinema-iQ-AppleTV-unsigned.ipa"
      - name: Upload Apple TV IPA for atvloadly
        if: inputs.include_apple_tv
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/tv-output/Cinema-iQ-AppleTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload IPA for Windows sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-iPhone-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-output/Cinema-iQ-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Explain installation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Universal iPhone and iPad preview for Windows testing
          Download the artifact ZIP, extract it, and select **Cinema-iQ-iPhone-unsigned.ipa** in Sideloadly on Windows. This single arm64 device app supports both iPhone and iPad.

          Install and use Sideloadly from https://sideloadly.io/. Connect and trust the iPhone, sign with your own Apple account, and enable Developer Mode on the phone if requested. Free-account signing normally expires after 7 days and must be renewed. Do not send Apple credentials, verification codes or signing certificates to the repository or chat.

          No Apple developer certificate or GitHub signing secret is required for this unsigned artifact. The iOS artifact expires after one day. This workflow does not publish releases or upload to TestFlight. See `ios/WINDOWS-TESTING.md` for installation steps.
          SUMMARY
