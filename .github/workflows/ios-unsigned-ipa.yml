name: Build unsigned iPhone IPA

# Manual only: exporting an app requires an explicit user build request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iphone-ipa:
    runs-on: macos-15
    env:
      # Downloadable previews must never embed repository metadata credentials.
      TMDB_API_KEY: ""
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/CinemaIQDerivedData" >> "$GITHUB_ENV"
          echo "IPA_STAGING=$RUNNER_TEMP/CinemaIQIPA" >> "$GITHUB_ENV"
      - name: Select the newest installed Xcode
        # Liquid Glass needs the iOS 26 SDK or later; the app still builds (without glass) on older Xcode.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
      - name: Inspect Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test source parsing
        run: swift test --package-path ios/Core
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile Release for physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
      - name: Package unsigned device app
        run: |
          set -euo pipefail
          device_app="$DERIVED_DATA/Build/Products/Release-iphoneos/CinemaIQ.app"
          test -d "$device_app"
          test -x "$device_app/CinemaIQ"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$device_app/Info.plist"
          xcrun lipo "$device_app/CinemaIQ" -verify_arch arm64
          mkdir -p "$IPA_STAGING/Payload" "$RUNNER_TEMP/ipa-output"
          ditto "$device_app" "$IPA_STAGING/Payload/CinemaIQ.app"
          ditto -c -k --keepParent "$IPA_STAGING/Payload" "$RUNNER_TEMP/ipa-output/Cinema-iQ-iPhone-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/ipa-output/Cinema-iQ-iPhone-unsigned.ipa"
      - name: Compile Release for Apple TV without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
      - name: Package unsigned Apple TV app
        run: |
          set -euo pipefail
          tv_app="$DERIVED_DATA/Build/Products/Release-appletvos/CinemaIQTV.app"
          test -d "$tv_app"
          test -x "$tv_app/CinemaIQTV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$tv_app/Info.plist"
          xcrun lipo "$tv_app/CinemaIQTV" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/TVIPA/Payload" "$RUNNER_TEMP/tv-output"
          ditto "$tv_app" "$RUNNER_TEMP/TVIPA/Payload/CinemaIQTV.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/TVIPA/Payload" "$RUNNER_TEMP/tv-output/Cinema-iQ-AppleTV-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/tv-output/Cinema-iQ-AppleTV-unsigned.ipa"
      - name: Upload Apple TV IPA for atvloadly
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/tv-output/Cinema-iQ-AppleTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload IPA for Windows sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-iPhone-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-output/Cinema-iQ-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Explain installation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## iPhone preview for Windows testing
          Download the artifact ZIP, extract it, and select **Cinema-iQ-iPhone-unsigned.ipa** in Sideloadly on Windows. This is an arm64 iPhone app, not a simulator build.

          Install and use Sideloadly from https://sideloadly.io/. Connect and trust the iPhone, sign with your own Apple account, and enable Developer Mode on the phone if requested. Free-account signing normally expires after 7 days and must be renewed. Do not send Apple credentials, verification codes or signing certificates to the repository or chat.

          No Apple developer certificate or GitHub signing secret is required for this unsigned artifact. The download expires after 3 days. No public release or TestFlight upload is performed. See `ios/WINDOWS-TESTING.md` for steps and preview limitations.
          SUMMARY

  publish-authorized-tv-preview:
    if: github.ref == 'refs/heads/chatgpt/ios-tvos-reference-interface'
    needs: iphone-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: tvos-v0.3.0-preview.1
    steps:
      - name: Require successful checks for this exact source commit
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > runs.json
          python3 - <<'PY'
          import json, os
          runs = json.load(open('runs.json'))['workflow_runs']
          for name in ['iOS App Compile Check', 'Apple TV screenshots']:
              matches = [run for run in runs if run['name'] == name and run['head_sha'] == os.environ['GITHUB_SHA']]
              latest = max(matches, key=lambda run: run['id']) if matches else None
              if not latest or latest['conclusion'] != 'success':
                  raise SystemExit(f'Refusing release: {name} has not passed for this commit')
          PY
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing preview release.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-unsigned-${{ github.run_number }}
          path: preview
      - name: Verify platform, version and credential exclusion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, zipfile
          ipa = pathlib.Path('preview/Cinema-iQ-AppleTV-unsigned.ipa')
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read('Payload/CinemaIQTV.app/Info.plist'))
          assert info['CFBundleIdentifier'] == 'com.cinemaplus.rebuilt.tv', 'Unexpected bundle identifier'
          assert info['CFBundleShortVersionString'] == '0.3.0', 'Unexpected app version'
          assert info['CFBundleVersion'] == '3', 'Unexpected build number'
          assert info.get('CFBundleSupportedPlatforms') == ['AppleTVOS'], 'This must be a physical Apple TV app'
          assert not info.get('TMDBAPIKey'), 'Refusing publication of embedded repository credential'
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          pathlib.Path('preview/SHA256.txt').write_text(digest + '  ' + ipa.name + '\n')
          pathlib.Path('preview/SOURCE.txt').write_text('Source commit: ' + os.environ['GITHUB_SHA'] + '\n')
          PY
      - name: Publish the requested separate Apple TV prerelease
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF_NOTES
          Apple TV preview 0.3.0 (3), built from source commit $GITHUB_SHA on the separate chatgpt/ios-tvos-reference-interface branch.

          Includes the reference Home/Settings layouts, native-controls poster/title overlay, playback completion/quality/subtitle/retry repairs, retained search state, and reliable account-library-copy reporting.

          This IPA is for physical Apple TV (tvOS), not iPhone or Android. It is unsigned: atvloadly must sign or re-sign it using your configured Apple identity before installation. No signing identity or private repository metadata credential is included. It is not an App Store or TestFlight release.

          Automated Core, iPhone/tvOS compilation and simulator checks passed for this exact commit before publication. ISP-restricted catalogs, real-account sync and physical-device playback still require testing on your Apple TV.
          EOF_NOTES
          gh release create "$PREVIEW_TAG" \
            preview/Cinema-iQ-AppleTV-unsigned.ipa preview/SHA256.txt preview/SOURCE.txt \
            --target "$GITHUB_SHA" --title 'Cinema iQ Apple TV 0.3.0 Preview' \
            --notes-file release-notes.md --prerelease
