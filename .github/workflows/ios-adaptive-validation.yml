name: iPhone and iPad layout checks
on:
  # Hosted XCTest accessibility/launch services can time out independently of app assertions.
  # Keep visual evidence collection available on demand; deterministic compile/Core checks stay automatic.
  workflow_dispatch:
    inputs:
      scenario:
        description: Layout tour, Apple TV parity, or production movie controls regression
        type: choice
        options: [all, cinematic, continue_watching, keyboard, parity, movie_controls, movie_controls_apple, movie_and_episodes, episodes]
        default: all
      runner:
        description: Hosted macOS runner for simulator validation
        type: choice
        options: [macos-15-intel, macos-15, macos-26]
        default: macos-15-intel
      live_tmdb:
        description: Also verify a featured movie against live TMDB metadata on the cinematic tour
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ios-adaptive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: ${{ inputs.scenario == 'parity' && 65 || 55 }}
    strategy:
      fail-fast: false
      matrix:
        device: ${{ (startsWith(inputs.scenario, 'movie_') || inputs.scenario == 'episodes') && fromJSON('["iphone"]') || fromJSON('["iphone","ipad"]') }}
    env:
      UI_TEST_SCENARIO: ${{ inputs.scenario }}
      IOS_TEST_KIND: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Select compatible Xcode and generate project
        env:
          FEATURED_TMDB_KEY: ${{ inputs.live_tmdb && inputs.scenario == 'cinematic' && secrets.TMDB_API_KEY || '' }}
          CHECK_LIVE_TMDB: ${{ inputs.live_tmdb && inputs.scenario == 'cinematic' }}
        run: |
          set -euo pipefail
          # Match the hosted iOS 18.5 runtime to its XCTest driver. Latest-SDK
          # Release compilation is covered by ios-app-compile.yml separately.
          if [[ "$UI_TEST_SCENARIO" != cinematic && "$UI_TEST_SCENARIO" != continue_watching && "$UI_TEST_SCENARIO" != keyboard && -d /Applications/Xcode_16.4.app ]]; then
            chosen=/Applications/Xcode_16.4.app
          else
            chosen="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          cp ios/CinemaIQUITests/Fixtures/movie-audio-pattern.mp4 ios/CinemaIQ/Resources/UIPlayerFixture.mp4
          cp ios/CinemaIQUITests/Fixtures/compatibility-pattern.mkv ios/CinemaIQ/Resources/UICompatibilityFixture.mkv
          cd ios
          if [ "$CHECK_LIVE_TMDB" = true ]; then
            plutil -create xml1 CinemaIQUITests/LiveFeaturedCheck.plist
          fi
          xcodegen generate --spec project.yml
          # Default fixtures are offline for metadata. Only an explicitly requested live check uses TMDB.
          python3 - <<'PY'
          import os, pathlib, plistlib
          path = pathlib.Path('Generated/Info.plist')
          with path.open('rb') as file:
              info = plistlib.load(file)
          info['OMDbAPIKey'] = ''
          info['TMDBAPIKey'] = os.environ.get('FEATURED_TMDB_KEY', '')
          if os.environ['CHECK_LIVE_TMDB'] == 'true' and not info['TMDBAPIKey']:
              raise SystemExit('The live poster check requires the TMDB_API_KEY secret')
          with path.open('wb') as file:
              plistlib.dump(info, file)
          PY
      - name: Create simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q 'iOS'; then xcodebuild -downloadPlatform iOS; fi
          python3 - <<'PY'
          import json, os, subprocess
          def sim(*args):
              return subprocess.check_output(['xcrun','simctl',*args], text=True)
          runtimes = [r for r in json.loads(sim('list','runtimes','--json'))['runtimes']
                      if r['isAvailable'] and '.iOS-' in r['identifier'] and int(r['version'].split('.')[0]) >= 18]
          # Exercise backward compatibility on the oldest installed supported runtime.
          # The device compile check separately uses the newest Xcode/SDK.
          choose = max if os.environ['UI_TEST_SCENARIO'] in ('cinematic','continue_watching','keyboard') else min
          runtime = choose(runtimes, key=lambda r: tuple(map(int,r['version'].split('.'))))['identifier']
          print('UI test runtime:', runtime, flush=True)
          types = json.loads(sim('list','devicetypes','--json'))['devicetypes']
          tablet = os.environ['IOS_TEST_KIND'] == 'ipad'
          if tablet:
              device_type = next(t['identifier'] for t in types if 'iPad Pro 11-inch' in t['name'] and 'M4' in t['name'])
          else:
              device_type = next(t['identifier'] for t in types if t['name'] == 'iPhone 16 Pro')
          device = sim('create','CinemaLayoutCheck',device_type,runtime).strip()
          with open(os.environ['GITHUB_ENV'],'a') as file:
              file.write('IOS_TEST_DEVICE='+device+'\n')
          PY
      - name: Compile app and UI tests before booting
        timeout-minutes: 12
        run: |
          set -o pipefail
          # Keep the compiler from competing with first-boot migration/accessibility services.
          xcodebuild build-for-testing -project ios/CinemaIQ.xcodeproj -scheme CinemaIQ \
            -destination "id=$IOS_TEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/iOSDerived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- TMDB_API_KEY= OMDB_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'TEST BUILD SUCCEEDED' "$RUNNER_TEMP/ios-build.log"
      - name: Validate universal device and orientation metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'iOSDerived/Build/Products/Debug-iphonesimulator/CinemaIQ.app/Info.plist'
          with path.open('rb') as file:
              info = plistlib.load(file)
          assert info['UIDeviceFamily'] == [1,2]
          assert info['CFBundleIdentifier'] == 'com.cinemaplus.rebuilt.ios'
          assert len(info['UISupportedInterfaceOrientations~ipad']) == 4
          assert not info.get('UIRequiresFullScreen',False)
          print('Universal iPhone/iPad app; all tablet orientations; resizable-window eligibility verified')
          PY
      - name: Boot Simulator with a display
        timeout-minutes: 10
        run: |
          set -euo pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$IOS_TEST_DEVICE"
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$IOS_TEST_DEVICE"
          xcrun simctl bootstatus "$IOS_TEST_DEVICE" -b
          xcrun simctl io "$IOS_TEST_DEVICE" screenshot "$RUNNER_TEMP/simulator-ready.png"
      - name: Test touch navigation and playback rotation
        # Parity contains ten independent phone cases; retain their individual limits.
        timeout-minutes: ${{ (inputs.scenario == 'parity' || inputs.scenario == 'cinematic') && 35 || 25 }}
        env:
          UI_TEST_SCENARIO: ${{ inputs.scenario || 'all' }}
          CHECK_LIVE_TMDB: ${{ inputs.live_tmdb && inputs.scenario == 'cinematic' }}
        run: |
          set -o pipefail
          test_ids=(-only-testing:CinemaIQUITests/AdaptiveLayoutTests)
          if [ "$UI_TEST_SCENARIO" = cinematic ]; then
            test_ids=(-only-testing:CinemaIQUITests/AdaptiveLayoutTests/testCinematicHomeAndDirectTelevision
                      -only-testing:CinemaIQUITests/AdaptiveLayoutTests/testContinueWatchingReordersAndRemovesCompletedMovieAndSeries
                      -only-testing:CinemaIQUITests/AdaptiveLayoutTests/testResumeCardSizesAndAdaptiveFeaturedArt
                      -only-testing:CinemaIQUITests/AdaptiveLayoutTests/testRepeatedNativeTabSwitches
                      -only-testing:CinemaIQUITests/ArtworkParityTests/testTallPosterKeepsBothColoredEdgesInHomeHero
                      -only-testing:CinemaIQUITests/PhoneParityTests/testSearchSubmitDismissesKeyboardAndDetailReturnPreservesQuery
                      -only-testing:CinemaIQUITests/PhoneParityTests/testAccountKeyboardNextAndBothDoneActionsStayDismissedAfterTabReturn)
            if [ "$CHECK_LIVE_TMDB" = true ]; then
              test_ids+=(-only-testing:CinemaIQUITests/LiveFeaturedMetadataTests/testFeaturedMovieDisplaysTMDBScoreAndYear)
            fi
          fi
          if [ "$UI_TEST_SCENARIO" = continue_watching ]; then
            test_ids=(-only-testing:CinemaIQUITests/AdaptiveLayoutTests/testContinueWatchingReordersAndRemovesCompletedMovieAndSeries)
          fi
          if [ "$UI_TEST_SCENARIO" = keyboard ]; then
            test_ids=(-only-testing:CinemaIQUITests/PhoneParityTests/testAccountKeyboardNextAndBothDoneActionsStayDismissedAfterTabReturn
                      -only-testing:CinemaIQUITests/PhoneParityTests/testSearchSubmitDismissesKeyboardAndDetailReturnPreservesQuery)
          fi
          if [ "$UI_TEST_SCENARIO" = parity ]; then
            test_ids=(-only-testing:CinemaIQUITests/ArtworkParityTests -only-testing:CinemaIQUITests/PhoneParityTests)
            if [ "$IOS_TEST_KIND" = iphone ]; then test_ids+=(-only-testing:CinemaIQUITests/MovieControlsTests); fi
          fi
          if [ "$UI_TEST_SCENARIO" = movie_controls ]; then test_ids=(-only-testing:CinemaIQUITests/MovieControlsTests); fi
          if [ "$UI_TEST_SCENARIO" = movie_controls_apple ]; then test_ids=(-only-testing:CinemaIQUITests/MovieControlsTests/testAppleControlsReturnAfterAutomaticHide); fi
          if [ "$UI_TEST_SCENARIO" = episodes ]; then test_ids=(-only-testing:CinemaIQUITests/MovieControlsTests/testPendingPauseEpisodeSheetKeepsCurrentAndSelectsNext); fi
          if [ "$UI_TEST_SCENARIO" = movie_and_episodes ]; then
            test_ids=(-only-testing:CinemaIQUITests/MovieControlsTests
                      -only-testing:CinemaIQUITests/ArtworkParityTests/testSeriesHasSeasonButtonAndHorizontallyScrollableEpisodeCards)
          fi
          xcodebuild test-without-building -project ios/CinemaIQ.xcodeproj -scheme CinemaIQ \
            -destination "id=$IOS_TEST_DEVICE" \
            "${test_ids[@]}" \
            -derivedDataPath "$RUNNER_TEMP/iOSDerived" -resultBundlePath "$RUNNER_TEMP/ios-layout.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- TMDB_API_KEY= OMDB_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/ios-layout.log" | grep -E 'error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)' || true
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' "$RUNNER_TEMP/ios-layout.log"
      - name: Export simulator evidence
        if: always()
        run: |
          python3 ios/scripts/collect-ui-fallback.py
          if [ -d "$RUNNER_TEMP/ios-layout.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ios-layout.xcresult" --output-path "$RUNNER_TEMP/ios-evidence" || true
            if [ -d "$RUNNER_TEMP/ios-evidence" ]; then find "$RUNNER_TEMP/ios-evidence" -name '*.mp4' -delete; fi
          fi
          grep -E 'error:|failed|Timed out|Testing started|Test Case' "$RUNNER_TEMP/ios-layout.log" | tail -40 || true
          # Network diagnostics can contain request URLs. For a credentialed run keep only images,
          # the XCTest attachment index and test outcome lines in downloadable evidence.
          if [ "${{ inputs.live_tmdb && inputs.scenario == 'cinematic' }}" = true ]; then
            for evidence in ios-evidence ios-fallback-evidence; do
              if [ -d "$RUNNER_TEMP/$evidence" ]; then
                find "$RUNNER_TEMP/$evidence" -type f ! -name '*.png' ! -name manifest.json -delete
              fi
            done
            rm -f "$RUNNER_TEMP/ios-build.log"
            if [ -f "$RUNNER_TEMP/ios-layout.log" ]; then
              grep -E "^Test Case '-\[CinemaIQUITests\.[A-Za-z0-9_]+ [A-Za-z0-9_]+\]' (passed|failed|started)" "$RUNNER_TEMP/ios-layout.log" > "$RUNNER_TEMP/ios-outcomes.log" || true
              mv "$RUNNER_TEMP/ios-outcomes.log" "$RUNNER_TEMP/ios-layout.log"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-adaptive-${{ matrix.device }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-layout.log
            ${{ runner.temp }}/ios-evidence
            ${{ runner.temp }}/ios-fallback-evidence
            ${{ runner.temp }}/simulator-ready.png
          retention-days: 1
          if-no-files-found: warn
