name: iOS App Compile Check

# Compiles the SwiftUI app for a physical iPhone without signing and without uploading anything (no IPA export).
# Runs only for pushes to iOS work branches, so ordinary Android work never uses macOS minutes.
on:
  push:
    branches: ['claude/ios-**', 'chatgpt/ios-**', 'chatgpt/tvos-preview-0.3.1']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    # Metadata keys remain blank except the explicitly authorized TMDB inclusion for Apple TV 0.3.1.
    env:
      TMDB_API_KEY: ""
      OMDB_API_KEY: ""
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          echo "::notice::$(xcodebuild -version | head -1), iOS SDK $(xcrun --sdk iphoneos --show-sdk-version), $(swift --version 2>&1 | head -1)"
      - name: Install project generator
        run: brew install xcodegen
      - name: Test source parsing
        shell: bash
        run: |
          set +e
          swift test --package-path ios/Core 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Compiler and test failures as annotations, readable without the full log.
            grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/swift-test.log" | grep -v "Test Suite" | sed 's#.*/ios/Core/##' | cut -c1-300 | head -30 | while read -r line; do echo "::error::$line"; done
          fi
          exit $status
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile for physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" OMDB_API_KEY="$OMDB_API_KEY" CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"
      - name: Verify the approved TMDB key and cast service without logging the key
        if: github.ref == 'refs/heads/chatgpt/tvos-preview-0.3.1'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.parse, urllib.request
          key = os.environ.get('TMDB_API_KEY', '')
          if not key:
              raise SystemExit('TMDB_API_KEY is not configured; refusing a silently incomplete preview.')
          query = urllib.parse.urlencode({'api_key': key, 'append_to_response': 'credits'})
          try:
              with urllib.request.urlopen('https://api.themoviedb.org/3/movie/550?' + query, timeout=20) as response:
                  result = json.load(response)
          except Exception as error:
              raise SystemExit('TMDB verification failed: ' + type(error).__name__)
          people = result.get('credits', {}).get('cast', [])
          if result.get('id') != 550 or not any(person.get('profile_path') for person in people):
              raise SystemExit('TMDB did not return expected title/cast portraits.')
          print('Verified configured TMDB credential and live cast portrait metadata; no value logged.')
          PYTHON
      - name: Compile the Apple TV app without signing
        env:
          # Only this preview's tvOS Release app may embed the TMDB key, with explicit user risk acceptance.
          TMDB_API_KEY: ${{ github.ref == 'refs/heads/chatgpt/tvos-preview-0.3.1' && secrets.TMDB_API_KEY || '' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY="$TMDB_API_KEY" OMDB_API_KEY="$OMDB_API_KEY" CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test "$(grep -c "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log")" -ge 2
      - name: Verify only the approved preview metadata credential is included
        run: |
          set -euo pipefail
          plist=$(find "$RUNNER_TEMP/DerivedData" -path '*Release-appletvos/CinemaIQTV.app/Info.plist' | head -1)
          test -n "$plist"
          PLIST="$plist" python3 - <<'PYTHON'
          import os, plistlib
          with open(os.environ['PLIST'], 'rb') as source:
              info = plistlib.load(source)
          approved = os.environ['GITHUB_REF'] == 'refs/heads/chatgpt/tvos-preview-0.3.1'
          if bool(info.get('TMDBAPIKey', '')) != approved:
              raise SystemExit('TMDB credential presence does not match the approved preview scope.')
          if info.get('OMDbAPIKey', '') or info.get('YouTubeAPIKey', ''):
              raise SystemExit('Refusing export: an unapproved metadata credential is present.')
          print('Verified TMDB presence matches approval; OMDb and YouTube credentials remain excluded.')
          PYTHON
      - name: Package the requested unsigned Apple TV branch preview
        if: github.ref == 'refs/heads/chatgpt/ios-tvos-reference-interface' || github.ref == 'refs/heads/chatgpt/tvos-preview-0.3.1'
        run: |
          set -euo pipefail
          tv_app="$RUNNER_TEMP/DerivedData/Build/Products/Release-appletvos/CinemaIQTV.app"
          test -x "$tv_app/CinemaIQTV"
          xcrun lipo "$tv_app/CinemaIQTV" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/TVPreview/Payload" "$RUNNER_TEMP/tv-preview-output"
          ditto "$tv_app" "$RUNNER_TEMP/TVPreview/Payload/CinemaIQTV.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/TVPreview/Payload" "$RUNNER_TEMP/tv-preview-output/Cinema-iQ-AppleTV-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/tv-preview-output/Cinema-iQ-AppleTV-unsigned.ipa"
          printf 'Source commit: %s\nUnsigned arm64 Apple TV preview. Requires user signing before installation. Not App Store/TestFlight.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/tv-preview-output/README.txt"
          shasum -a 256 "$RUNNER_TEMP/tv-preview-output/Cinema-iQ-AppleTV-unsigned.ipa" > "$RUNNER_TEMP/tv-preview-output/SHA256.txt"
      - name: Upload the requested Apple TV preview
        if: github.ref == 'refs/heads/chatgpt/ios-tvos-reference-interface' || github.ref == 'refs/heads/chatgpt/tvos-preview-0.3.1'
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-branch-preview-${{ github.sha }}
          path: ${{ runner.temp }}/tv-preview-output
          if-no-files-found: error
          retention-days: 14
      - name: Report compile errors
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/build.log" | head -40 | while read -r line; do echo "::error::$line"; done
