name: Check pull request
# Compiles the app, runs the unit tests and checks that the minified release build still compiles. It builds no APK, uses no secrets and publishes nothing.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, run unit tests and build the minified release
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the first compiler and test errors as one annotation, readable without the full log.
            summary=$(grep -E '^e: |FAILED|What went wrong|Execution failed|R8|Missing class|ERROR:' "$RUNNER_TEMP/gradle.log" | sed 's#file:///home/runner/work/Cinema-IQ/Cinema-IQ/app/src/main/java/com/cinemaplus/rebuilt/##' | cut -c1-230 | head -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::${summary}"
          fi
          exit $status
