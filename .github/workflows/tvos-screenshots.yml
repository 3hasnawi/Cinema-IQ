name: Apple TV screenshots

# Unsigned simulator validation only. Artifacts stay on the workflow run, never in a shared branch.
on:
  workflow_dispatch:
  push:
    branches: ['chatgpt/ios-tvos-reference-interface']
    paths:
      - 'ios/**'
      - 'scripts/ci/**'
      - '.github/workflows/tvos-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: tvos-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable installed Xcode
        run: |
          set -euo pipefail
          newest="$(python3 - <<'PY'
          import glob, re
          paths = [p for p in glob.glob('/Applications/Xcode_*.app')
                   if re.fullmatch(r'/Applications/Xcode_[0-9.]+\.app', p)]
          if not paths:
              raise SystemExit('No stable Xcode found')
          print(max(paths, key=lambda p: tuple(map(int, re.findall(r'\d+', p)))))
          PY
          )"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Validate simulator selector
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Prepare a supported Apple TV simulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvos-diagnostics"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/tvos-diagnostics/runtimes.json"
          if ! selection="$(python3 scripts/ci/select_tvos_simulator.py < "$RUNNER_TEMP/tvos-diagnostics/runtimes.json")"; then
            xcodebuild -downloadPlatform tvOS 2>&1 | tee "$RUNNER_TEMP/tvos-diagnostics/runtime-download.log"
            xcrun simctl list runtimes --json > "$RUNNER_TEMP/tvos-diagnostics/runtimes.json"
            selection="$(python3 scripts/ci/select_tvos_simulator.py < "$RUNNER_TEMP/tvos-diagnostics/runtimes.json")"
          fi
          read -r runtime type <<< "$selection"
          device="$(xcrun simctl create CinemaTV "$type" "$runtime")"
          echo "TV_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Build and run focused demo-source navigation tests
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvos-diagnostics"
          # Fail clearly rather than silently selecting zero tests on an older manual-dispatch ref.
          grep -Rq 'class TVNavigationTests:' ios/CinemaIQTVUITests
          grep -Rq 'class TVSettingsNavigationTests:' ios/CinemaIQTVUITests
          xcodebuild test \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQTV \
            -destination "id=$TV_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/tvos-derived" \
            -resultBundlePath "$RUNNER_TEMP/tvos-diagnostics/shots.xcresult" \
            -only-testing:CinemaIQTVUITests/TVNavigationTests \
            -only-testing:CinemaIQTVUITests/TVSettingsNavigationTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO TMDB_API_KEY= \
            2>&1 | tee "$RUNNER_TEMP/tvos-diagnostics/xcodebuild.log"
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/tvos-diagnostics/shots.xcresult" \
            > "$RUNNER_TEMP/tvos-diagnostics/test-summary.json"
          python3 - "$RUNNER_TEMP/tvos-diagnostics/test-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          if summary.get('passedTests', 0) < 2 or summary.get('failedTests', 0) != 0:
              raise SystemExit('Expected both focused test classes to run and pass; inspect test-summary.json')
          PY
      - name: Export screenshots and retain crash reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvos-diagnostics/screenshots" "$RUNNER_TEMP/tvos-diagnostics/crashes"
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'CinemaIQTV*' \
              -exec cp {} "$RUNNER_TEMP/tvos-diagnostics/crashes/" \;
          fi
          if [ -d "$RUNNER_TEMP/tvos-diagnostics/shots.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/tvos-diagnostics/shots.xcresult" \
              --output-path "$RUNNER_TEMP/tvos-diagnostics/screenshots"
          fi
      - name: Package unsigned simulator app if compilation finished
        if: always()
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/tvos-derived/Build/Products/Debug-appletvsimulator/CinemaIQTV.app"
          if [ -d "$app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/CinemaIQTV-unsigned-simulator.zip"
          fi
      - name: Upload diagnostics and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tvos-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Upload unsigned simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-unsigned-simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CinemaIQTV-unsigned-simulator.zip
          if-no-files-found: ignore
          retention-days: 7
