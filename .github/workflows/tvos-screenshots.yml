name: Apple TV screenshots

# Manual only: runs the Apple TV app in the tvOS simulator, walks its screens with the remote and uploads the
# screenshots. Nothing is signed or exported.
on:
  workflow_dispatch:
  # Also when the tour itself changes on an Apple TV work branch.
  push:
    branches: ['claude/ios-tvos-**']
    paths:
      - 'ios/CinemaIQTV/**'
      - 'ios/CinemaIQTVUITests/**'
      - '.github/workflows/tvos-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Prepare an Apple TV simulator
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "tvOS"; then
            xcodebuild -downloadPlatform tvOS
          fi
          xcrun simctl list runtimes
          runtime="$(xcrun simctl list runtimes | grep tvOS | tail -1 | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+).*/\1/')"
          type="$(xcrun simctl list devicetypes | grep -m1 'Apple TV 4K' | sed -E 's/.*\((com\.apple\.[^)]+)\).*/\1/')"
          device="$(xcrun simctl create CinemaTV "$type" "$runtime")"
          xcrun simctl boot "$device"
          echo "TV_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Walk the app and take screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/CinemaIQ.xcodeproj \
            -scheme CinemaIQTV \
            -destination "id=$TV_DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/shots.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" || true
      - name: Export screenshots
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/shots.xcresult" --output-path "$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
      - name: Publish screenshots to the tvos-screenshots branch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/named"; mkdir -p "$out"
          python3 - "$RUNNER_TEMP/shots" "$out" <<'PY'
          import json, shutil, sys, os
          src, dst = sys.argv[1], sys.argv[2]
          for test in json.load(open(os.path.join(src, "manifest.json"))):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_")[0]
                  shutil.copy(os.path.join(src, a["exportedFileName"]), os.path.join(dst, name + ".png"))
          PY
          for f in "$out"/*.png; do sips -Z 1280 "$f" >/dev/null; done
          cd "$out"
          git init -q -b tvos-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Apple TV screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tvos-screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-iQ-AppleTV-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: error
          retention-days: 3
