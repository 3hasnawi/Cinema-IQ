name: Android phone screenshots

# Builds a debug APK (never published), runs it in a phone emulator, walks it with taps and publishes the
# screenshots to the phone-screenshots branch. Manual, or on pushes to a phone work branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/phone-**']
    paths:
      - 'app/**'
      - '.github/scripts/phone-tour.sh'
      - '.github/workflows/phone-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: phone-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK for the emulator
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the app in a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/phone-tour.sh "$RUNNER_TEMP/phone-shots"
      - name: Publish screenshots to the phone-screenshots branch
        if: always()
        run: |
          set -euo pipefail
          trap 'echo "::error::publish failed (exit $?) at: $BASH_COMMAND"' ERR
          mkdir -p "$RUNNER_TEMP/phone-shots"; cd "$RUNNER_TEMP/phone-shots"
          ls
          git init -q -b phone-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Android phone screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" phone-screenshots 2>&1 | tail -3 | sed 's/^/::warning::push: /'
